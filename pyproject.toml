[project]
name = "chatbot-service"
version = "0.1.0"
description = "FastAPI Chatbot Microservice running alongside Node.js backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "fastapi>=0.110.0",
    "httpx>=0.25.0",
    "langchain-text-splitters>=0.0.1",
    "motor>=3.3.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "qdrant-client>=1.9.0",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
